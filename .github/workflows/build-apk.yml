name: Build Android APK

# 触发条件：手动触发 + 推送到 main 分支时自动编译
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Java 17（Android 编译需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Flutter（与本地版本一致：3.29.0）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      # 4. 拉依赖
      - name: Install dependencies
        run: flutter pub get

      # 5. 编译 release APK（debug 签名，可直接安装到手机）
      - name: Build APK
        run: flutter build apk --release

      # 6. 把产物作为 artifact 上传，供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sf6-note-apk
          # 编译产物固定在这个路径
          path: build/app/outputs/flutter-apk/app-release.apk
